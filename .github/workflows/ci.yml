name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs the toolchain pinned in mise.toml
      - run: npm ci
      - run: npm run check
      - run: npm run build
